name: PDF Workbench CI

on:
  push:
    branches:
      - main
      - feat/pdf-workbench-foundation
    paths:
      - "apps/pdf-workbench/**"
      - ".github/workflows/pdf-workbench.yml"
  pull_request:
    paths:
      - "apps/pdf-workbench/**"
      - ".github/workflows/pdf-workbench.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pdf-workbench-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: PDF workbench checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/pdf-workbench
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Upload lockfile bootstrap artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pdf-workbench-package-lock
          path: apps/pdf-workbench/package-lock.json
          if-no-files-found: error
          retention-days: 1

      - name: Run unit tests
        run: npm run test

      - name: Typecheck and build
        run: npm run build

      - name: Install Chromium for browser tests
        run: npx playwright install --with-deps chromium

      - name: Run browser smoke tests
        run: npm run test:e2e
